<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login System</title>

<style>
/* 🌈 Background */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🧊 Card */
.container {
  background: white;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
}

/* Title */
h2 {
  margin-bottom: 20px;
  color: #333;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 2px solid #eee;
  border-radius: 8px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #4facfe;
  box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
}

/* Buttons */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
  color: white;
}

button:hover {
  transform: scale(1.03);
  opacity: 0.9;
}

.register-btn {
  background: #4facfe;
}

.login-btn {
  background: #00c853;
}

/* Message */
#message {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>Login System</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button class="register-btn" onclick="register()">Register</button>
  <button class="login-btn" onclick="login()">Login</button>

  <p id="message"></p>
</div>

<script>
// 💾 REGISTER USER
function register() {
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;
  let message = document.getElementById("message");

  // check empty fields
  if (username === "" || password === "") {
    message.style.color = "red";
    message.innerText = "Please fill all fields!";
    return;
  }

  // save user
  let user = {
    username: username,
    password: password
  };

  localStorage.setItem("user", JSON.stringify(user));

  message.style.color = "green";
  message.innerText = "User registered successfully!";
}


// 🔐 LOGIN USER
function login() {
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;
  let message = document.getElementById("message");

  // check empty fields
  if (username === "" || password === "") {
    message.style.color = "red";
    message.innerText = "Please enter both username and password!";
    return;
  }

  let savedUser = JSON.parse(localStorage.getItem("user"));

  // no user found
  if (!savedUser) {
    message.style.color = "red";
    message.innerText = "No user registered!";
    return;
  }

  // check credentials
  if (username === savedUser.username && password === savedUser.password) {
    message.style.color = "green";
    message.innerText = "Login successful!";
  } else {
    message.style.color = "red";
    message.innerText = "Wrong username or password!";
  }
}
</script>

</body>
</html>
